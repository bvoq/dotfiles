# Generic, sane Kitty defaults.

font_family Menlo
font_size 13.0

# Keep terminal state manageable and readable.
scrollback_lines 100000
window_padding_width 6

# Bell behavior: no sound, subtle visual cue that works on light themes.
enable_audio_bell no
visual_bell_duration 0.14
# visual_bell_color #d9d9d9

# Cursor and refresh behavior.
cursor_shape block
cursor_blink_interval 0
repaint_delay 10
input_delay 3

# Usability defaults.
confirm_os_window_close 0
copy_on_select clipboard
strip_trailing_spaces smart

# Keep the tab/window title out of the macOS menu bar.
macos_show_window_title_in window


# BEGIN_KITTY_THEME
# zenwritten_dark
include current-theme.conf
# END_KITTY_THEME